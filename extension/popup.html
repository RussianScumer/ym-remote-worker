<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#1d1630; --soft:#6b6480; --line:#e4dff0; --sun:#ffd23f; --ok:#198754; --warn:#b8560f; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f6f2ff; --soft:#a9a2bd; --line:#3a3350; --ok:#7ee2a8; --warn:#ffb37a; }
    body { background:#1d1630; }
  }
  body { width: 300px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  h1 { font-size: 16px; margin: 0 0 12px; }
  label { display:block; font-size: 13px; color: var(--soft); margin-bottom: 4px; }
  .row { display:flex; gap:6px; }
  input { flex:1; min-width:0; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  button { padding:7px 12px; border:0; border-radius:8px; background:var(--sun); color:#2a1f00; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--soft); padding:4px 0; font-weight:400; text-decoration:underline; }
  #pair { margin-top:16px; text-align:center; }
  #qr { display:inline-block; background:#fff; padding:8px; border-radius:10px; line-height:0; }
  #qr svg { width:200px; height:200px; }
  #link { display:block; margin:8px 0 4px; font-size:12px; color:var(--soft); word-break:break-all; }
  #status { margin-top:12px; font-size:13px; display:flex; gap:6px; align-items:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--soft); flex:none; }
  #status[data-s="ok"] .dot { background:var(--ok); }
  #status[data-s="warn"] .dot { background:var(--warn); }
  .hint { color:var(--soft); font-size:13px; margin:12px 0 0; }
</style>
</head>
<body>
  <h1>Пульт для Яндекс Музыки</h1>

  <label for="server">Адрес вашего воркера</label>
  <div class="row">
    <input id="server" placeholder="https://ym-remote-worker.mishkailia2003.workers.dev" spellcheck="false">
    <button id="save">Сохранить</button>
  </div>

  <div id="pair" hidden>
    <div id="qr"></div>
    <a id="link" target="_blank"></a>
    <button class="ghost" id="reset">Сменить код (отвяжет старые телефоны)</button>
  </div>
  <p class="hint" id="hint">Укажите адрес воркера, чтобы получить QR-код для телефона.</p>

  <div id="status"><span class="dot"></span><span id="statusText"></span></div>

  <script src="qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
