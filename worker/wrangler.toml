name = "ym-remote"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Подключаем remote.html как текстовую строку
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
