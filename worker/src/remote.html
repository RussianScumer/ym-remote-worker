<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1630">
<title>Пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --scrim: rgba(29, 22, 48, 0.72);
    --ink: #f6f2ff;
    --ink-soft: rgba(246, 242, 255, 0.68);
    --sun: #ffd23f;
    --sun-ink: #2a1f00;
    --ghost: rgba(255, 255, 255, 0.12);
    --ok: #7ee2a8;
    --warn: #ffb37a;
    --ink-inv: #1d1630;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --scrim: rgba(250, 247, 255, 0.74);
      --ink: #1d1630;
      --ink-soft: rgba(29, 22, 48, 0.62);
      --ghost: rgba(29, 22, 48, 0.08);
      --ok: #198754;
      --warn: #b8560f;
      --ink-inv: #faf7ff;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #1d1630;
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  #bg {
    position: fixed; inset: -60px;
    background: #3a2d63 center / cover no-repeat;
    filter: blur(48px) saturate(1.4);
    transform: scale(1.1);
    transition: background-image .6s;
  }
  #scrim { position: fixed; inset: 0; background: var(--scrim); }

  main {
    position: relative;
    height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 0 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .status, .view { padding: 0 28px; }
  .view {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 24px;
    padding-bottom: 8px;
  }
  .view[hidden] { display: none; }
  #vPlayer { gap: 20px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ghost) transparent; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--ink-soft);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-soft); flex: none; }
  .status[data-s="ok"] .dot { background: var(--ok); }
  .status[data-s="warn"] .dot { background: var(--warn); }

  .cover {
    width: min(100%, 36vh);
    aspect-ratio: 1;
    flex: none;
    align-self: center;
    border-radius: 18px;
    background: var(--ghost);
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.55);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover img[hidden] { display: none; }

  .meta { min-height: 76px; }
  h1 {
    font-family: "Unbounded", "Manrope", system-ui, sans-serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
    margin: 0 0 6px;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .artist {
    margin: 0; font-size: 16px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
  }
  button {
    border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    color: var(--ink); background: transparent;
    border-radius: 50%;
    transition: transform .12s, opacity .2s;
    touch-action: manipulation;
  }
  button:active { transform: scale(.92); }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }
  button:disabled { opacity: .35; pointer-events: none; }
  .skip { width: 72px; height: 72px; background: var(--ghost); }
  .skip svg { width: 30px; height: 30px; }
  .play {
    width: 112px; height: 112px;
    background: var(--sun); color: var(--sun-ink);
    box-shadow: 0 14px 40px -10px rgba(255, 210, 63, .55);
  }
  .play svg { width: 44px; height: 44px; }

  .wave {
    align-self: center;
    display: flex; gap: 10px; align-items: center;
    padding: 12px 22px; border-radius: 999px;
    background: var(--ghost); color: var(--ink);
    font: 600 15px "Manrope", system-ui, sans-serif;
  }
  .wave svg { width: 20px; height: 20px; }

  .tabs {
    display: flex; justify-content: space-around;
    padding: 6px 12px 10px;
    border-top: 1px solid var(--ghost);
  }
  .tabs button {
    border-radius: 14px; padding: 6px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: 600 12px "Manrope", system-ui, sans-serif;
    color: var(--ink-soft);
  }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button[aria-selected="true"] { color: var(--ink); }
  .tabs button[aria-selected="true"] svg { color: var(--sun); }

  .lhead { display: flex; align-items: center; gap: 12px; }
  .lhead h2 {
    margin: 0; flex: 1; min-width: 0;
    font: 700 20px "Unbounded", "Manrope", system-ui, sans-serif;
  }
  .lhead small { display: block; margin-top: 4px; font: 400 13px "Manrope", system-ui, sans-serif; color: var(--ink-soft); }
  .pill {
    border-radius: 999px; padding: 10px 18px;
    background: var(--sun); color: var(--sun-ink);
    font: 600 14px "Manrope", system-ui, sans-serif;
  }
  .tracks {
    list-style: none; margin: 0 -28px; padding: 0 16px;
    flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--ghost) transparent;
  }
  .track {
    width: 100%; border-radius: 12px; padding: 6px 12px;
    display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px;
    align-items: center; justify-items: stretch;
    text-align: left; font: inherit;
  }
  .track:active { transform: none; background: var(--ghost); }
  .track img, .track .ph { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--ghost); display: block; }
  .track b, .track span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track b { font-weight: 600; font-size: 15px; }
  .track span { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .track time { font-size: 13px; color: var(--ink-soft); }
  .track.off { opacity: .4; }
  .track.busy { background: var(--ghost); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .55; } }
  .sform { display: flex; gap: 8px; }
  .sform input {
    flex: 1; min-width: 0;
    padding: 12px 16px; border: 0; border-radius: 999px;
    background: var(--ghost); color: var(--ink);
    font: 400 16px "Manrope", system-ui, sans-serif;
    -webkit-appearance: none; appearance: none;
  }
  .sform input::placeholder { color: var(--ink-soft); }
  .sform input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .sform button { width: 46px; height: 46px; flex: none; background: var(--sun); color: var(--sun-ink); }
  .sform button svg { width: 22px; height: 22px; }
  .msg { margin: 0; padding: 16px 0; text-align: center; color: var(--ink-soft); font-size: 14px; }
  .msg button { display: inline; margin-left: 6px; color: var(--sun); font: inherit; text-decoration: underline; border-radius: 0; }

  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--ink-inv); font-size: 14px;
  }
  #toast[hidden] { display: none; }

  .empty {
    margin: auto 0; padding: 0 28px; text-align: center; line-height: 1.5; color: var(--ink-soft);
  }
  .empty h1 { color: var(--ink); -webkit-line-clamp: unset; }
  @media (prefers-reduced-motion: reduce) {
    #bg, button { transition: none; }
    .track.busy { animation: none; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>

<main id="app">
  <div class="status" id="status" data-s="">
    <span class="dot"></span><span id="statusText">Подключение…</span>
  </div>

  <section class="view" id="vPlayer">
  <div class="cover"><img id="art" alt="" hidden></div>

  <div class="meta">
    <h1 id="title">—</h1>
    <p class="artist" id="artist"></p>
  </div>

  <div class="controls">
    <button class="skip" id="prev" aria-label="Предыдущий трек" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.5.5 0 0 1-.77.42L9.5 12.42a.5.5 0 0 1 0-.84l9.73-6.5A.5.5 0 0 1 20 5.5z"/></svg>
    </button>
    <button class="play" id="toggle" aria-label="Воспроизвести" disabled>
      <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a.6.6 0 0 0 .92.5l10.6-6.86a.6.6 0 0 0 0-1L8.92 4.64a.6.6 0 0 0-.92.5z"/></svg>
      <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button class="skip" id="next" aria-label="Следующий трек" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.5.5 0 0 0 .77.42l9.73-6.5a.5.5 0 0 0 0-.84L4.77 5.08A.5.5 0 0 0 4 5.5z"/></svg>
    </button>
  </div>

  <button class="wave" id="wave" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg>
    Моя волна
  </button>
  </section>

  <section class="view" id="vLikes" hidden>
    <div class="lhead">
      <h2>Мне нравится<small id="lCount"></small></h2>
      <button class="pill" id="playAll" disabled>Играть всё</button>
    </div>
    <ul class="tracks" id="lList"></ul>
  </section>

  <section class="view" id="vSearch" hidden>
    <form class="sform" id="sForm" role="search">
      <input id="sInput" type="search" enterkeyhint="search" maxlength="100" placeholder="Трек или исполнитель" aria-label="Поиск" autocomplete="off">
      <button type="submit" aria-label="Найти">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
    </form>
    <ul class="tracks" id="sList"></ul>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-v="vPlayer" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a.6.6 0 0 0 .92.5l10.6-6.86a.6.6 0 0 0 0-1L8.92 4.64a.6.6 0 0 0-.92.5z"/></svg>
      Плеер
    </button>
    <button role="tab" data-v="vLikes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg>
      Мне нравится
    </button>
    <button role="tab" data-v="vSearch" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      Поиск
    </button>
  </nav>
</main>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  var room = location.hash.slice(1);
  var $ = function (id) { return document.getElementById(id); };
  var ws = null, retry = 0, pingTimer = null, reconnectTimer = null;
  var state = null, online = false, connected = false;
  var pending = {}, seq = 0, toastTimer = null;
  var likes = { items: [], total: null, loading: false, at: 0, error: "" };

  if (!/^[a-f0-9]{32}$/.test(room)) {
    $("app").innerHTML =
      '<div class="empty"><h1>Пульт не привязан</h1>' +
      '<p>Откройте расширение в браузере на компьютере и отсканируйте QR-код телефоном.</p></div>';
    return;
  }

  function setStatus() {
    var s = $("status"), t = $("statusText");
    if (!connected) { s.dataset.s = "warn"; t.textContent = "Нет связи с сервером, переподключаюсь…"; }
    else if (!online) { s.dataset.s = "warn"; t.textContent = "Вкладка с Яндекс Музыкой закрыта"; }
    else { s.dataset.s = "ok"; t.textContent = "Компьютер на связи"; }
  }

  function render() {
    setStatus();
    var can = connected && online;
    ["prev", "toggle", "next", "wave", "playAll"].forEach(function (id) { $(id).disabled = !can; });
    $("playAll").disabled = !can || !likes.items.length;

    var st = state || {};
    $("title").textContent = st.title || (online ? "Ничего не играет" : "—");
    $("artist").textContent = st.artist || "";

    var art = $("art");
    if (st.artwork) {
      if (art.getAttribute("src") !== st.artwork) art.src = st.artwork;
      art.hidden = false;
      $("bg").style.backgroundImage = 'url("' + st.artwork.replace(/"/g, "%22") + '")';
    } else {
      art.hidden = true;
      $("bg").style.backgroundImage = "";
    }

    // У <svg> атрибут hidden не работает, скрываем через style.
    $("icPlay").style.display = st.playing ? "none" : "";
    $("icPause").style.display = st.playing ? "" : "none";
    $("toggle").setAttribute("aria-label", st.playing ? "Пауза" : "Воспроизвести");
    document.title = st.title ? st.title + " — пульт" : "Пульт";
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (ws && ws.readyState <= 1) return;
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws?role=remote&room=" + room);

    ws.onopen = function () {
      retry = 0; connected = true; render();
      clearInterval(pingTimer);
      pingTimer = setInterval(function () { if (ws.readyState === 1) ws.send("ping"); }, 25000);
    };
    ws.onmessage = function (e) {
      if (e.data === "pong") return;
      var d; try { d = JSON.parse(e.data); } catch (_) { return; }
      if (d.type === "res") { var p = pending[d.rid]; if (p) p(d); return; }
      if (d.type === "hello") { online = d.playerOnline; if (d.state) state = d.state; }
      else if (d.type === "state") { state = d.state; online = true; }
      else if (d.type === "player") { online = d.online; }
      render();
    };
    ws.onclose = function () {
      connected = false; clearInterval(pingTimer);
      Object.keys(pending).forEach(function (rid) { pending[rid]({ ok: false, error: "Связь прервалась" }); });
      render();
      reconnectTimer = setTimeout(connect, Math.min(10000, 500 * Math.pow(2, retry++)));
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }

  function send(action) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "cmd", action: action }));
    if (navigator.vibrate) navigator.vibrate(8);
    if (action === "toggle" && state) { state.playing = !state.playing; render(); }
  }

  // Запрос к расширению с ответом: rid связывает запрос и ответ.
  function request(msg, timeout) {
    return new Promise(function (resolve) {
      if (!ws || ws.readyState !== 1) return resolve({ ok: false, error: "Нет связи с сервером" });
      var rid = "q" + (++seq);
      var timer = setTimeout(function () { done({ ok: false, error: "Компьютер не ответил" }); }, timeout || 20000);
      function done(res) { clearTimeout(timer); delete pending[rid]; resolve(res); }
      pending[rid] = done;
      msg.rid = rid;
      ws.send(JSON.stringify(msg));
    });
  }

  function toast(text) {
    var t = $("toast");
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
  }

  function showView(id) {
    ["vPlayer", "vLikes", "vSearch"].forEach(function (v) { $(v).hidden = v !== id; });
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.v === id));
    });
    if (id === "vLikes" && (!likes.items.length || Date.now() - likes.at > 5 * 60000)) loadLikes(true);
  }
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () { showView(b.dataset.v); };
  });

  function fmt(ms) {
    var s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function trackItem(t, onTap) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.className = "track" + (t.ok && t.id ? "" : " off");
    var img;
    if (t.cover) { img = document.createElement("img"); img.src = t.cover; img.loading = "lazy"; img.alt = ""; }
    else { img = document.createElement("div"); img.className = "ph"; }
    var text = document.createElement("div");
    var title = document.createElement("b"); title.textContent = t.title;
    var artist = document.createElement("span"); artist.textContent = t.artist;
    text.append(title, artist);
    var time = document.createElement("time"); time.textContent = t.dur ? fmt(t.dur) : "";
    b.append(img, text, time);
    b.onclick = function () { onTap(b); };
    li.append(b);
    return li;
  }

  function likesMsg() {
    var list = $("lList"), old = $("lMsg");
    if (old) old.remove();
    var text = likes.loading ? "Загружаю…" : likes.error ? likes.error : (likes.total === 0 ? "Здесь пока пусто" : "");
    if (!text) return;
    var li = document.createElement("li");
    li.id = "lMsg"; li.className = "msg"; li.textContent = text;
    if (likes.error && !likes.loading) {
      var retry = document.createElement("button");
      retry.textContent = "Повторить";
      retry.onclick = function () { loadLikes(!likes.items.length); };
      li.append(retry);
    }
    list.append(li);
  }

  function loadLikes(reset) {
    if (likes.loading) return;
    if (reset) { likes.items = []; likes.total = null; $("lList").textContent = ""; $("lList").scrollTop = 0; }
    likes.loading = true; likes.error = "";
    likesMsg();
    request({ type: "req", what: "likes", offset: likes.items.length }).then(function (res) {
      likes.loading = false;
      if (!res.ok) { likes.error = res.error || "Не удалось загрузить"; likesMsg(); return; }
      var frag = document.createDocumentFragment(), start = likes.items.length;
      (res.items || []).forEach(function (t, k) {
        likes.items.push(t);
        frag.append(trackItem(t, function (b) { playLike(start + k, b); }));
      });
      $("lList").append(frag);
      likes.total = res.total;
      likes.at = Date.now();
      $("lCount").textContent = res.total ? res.total + " треков" : "";
      likesMsg();
      render();
    });
  }

  $("lList").addEventListener("scroll", function () {
    var l = $("lList");
    if (!likes.loading && !likes.error && likes.total !== null && likes.items.length < likes.total &&
        l.scrollTop + l.clientHeight > l.scrollHeight - 600) loadLikes(false);
  });

  // Вкладке нужно перейти на нужную страницу и долистать до трека — это может занять время.
  function play(t, msg, btn) {
    if (!t || !t.ok || !t.id || !connected || !online) return;
    if (navigator.vibrate) navigator.vibrate(8);
    if (btn) btn.classList.add("busy");
    msg.type = "play";
    msg.trackId = t.id;
    request(msg, 45000).then(function (res) {
      if (btn) btn.classList.remove("busy");
      if (res.ok) showView("vPlayer");
      else toast(res.error || "Не получилось включить трек");
    });
  }
  function playLike(i, btn) { play(likes.items[i], { src: "likes", index: i }, btn); }

  // Поиск: одна страница результатов (как вкладка «Треки» на сайте).
  var search = { q: "", seq: 0 };
  function searchMsg(text) {
    var old = $("sMsg");
    if (old) old.remove();
    if (!text) return;
    var li = document.createElement("li");
    li.id = "sMsg"; li.className = "msg"; li.textContent = text;
    $("sList").append(li);
  }
  $("sForm").onsubmit = function (e) {
    e.preventDefault();
    var q = $("sInput").value.trim();
    if (!q) return;
    $("sInput").blur(); // убираем клавиатуру, чтобы были видны результаты
    var my = ++search.seq;
    search.q = q;
    $("sList").textContent = "";
    searchMsg("Ищу…");
    request({ type: "req", what: "search", q: q }).then(function (res) {
      if (my !== search.seq) return; // уже ищем другое
      searchMsg("");
      if (!res.ok) { searchMsg(res.error || "Не удалось найти"); return; }
      var frag = document.createDocumentFragment();
      (res.items || []).forEach(function (t) {
        frag.append(trackItem(t, function (b) { play(t, { src: "search", q: q }, b); }));
      });
      $("sList").append(frag);
      if (!(res.items || []).length) searchMsg("Ничего не нашлось");
    });
  };
  $("playAll").onclick = function () {
    var first = likes.items.findIndex(function (t) { return t.ok && t.id; });
    if (first >= 0) playLike(first, null);
  };

  $("prev").onclick = function () { send("prev"); };
  $("next").onclick = function () { send("next"); };
  $("toggle").onclick = function () { send("toggle"); };
  $("wave").onclick = function () { send("wave"); };

  // Телефон «усыпляет» соединение в фоне — при возврате переподключаемся сразу.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { retry = 0; connect(); }
  });

  render();
  connect();
})();
</script>
</body>
</html>
